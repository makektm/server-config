[Service]
ExecStart=
ExecStart=/usr/bin/bluealsa -S -p a2dp-source -p a2dp-sink --keep-alive=30
# After BlueALSA starts, reconnect the C50BT and bounce Mopidy IF it's already
# running. Use try-restart (not restart) so this is a no-op at boot — otherwise
# BlueALSA's post-hook starts Mopidy before bt-softvol-init creates BTVolume,
# Mopidy's alsamixer extension fails and stays disabled, and the Iris vol slider
# disappears until the next manual Mopidy restart.
ExecStartPost=/bin/sh -c 'sleep 3 && bluetoothctl connect AE:EC:81:96:06:B7; sleep 2 && systemctl try-restart mopidy'
