[Service]
ExecStart=
ExecStart=/usr/bin/bluealsa -S -p a2dp-source -p a2dp-sink --keep-alive=30
# After BlueALSA starts, reconnect the C50BT and restart Mopidy.
# BlueALSA restart drops the BT connection; without this Mopidy's GStreamer
# pipeline enters an error loop that fights Raspotify for the PCM device.
ExecStartPost=/bin/sh -c 'sleep 3 && bluetoothctl connect AE:EC:81:96:06:B7; sleep 2 && systemctl restart mopidy'
