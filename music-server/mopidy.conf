# Mopidy configuration for RPi Zero 2 W music server
# Copy to /etc/mopidy/mopidy.conf
# Docs: https://docs.mopidy.com/en/latest/config/

[core]
cache_dir = /var/cache/mopidy
config_dir = /etc/mopidy
data_dir = /var/lib/mopidy

[logging]
verbosity = 0

[audio]
# Use ALSA mixer for volume control — changes are instant because
# they happen at the output stage, after the buffer (not software mixer)
mixer = alsamixer
mixer_volume = 20

# Route audio through BlueALSA to the C50BT Bluetooth speaker
# "btspeaker" is a named PCM defined in /etc/asound.conf
# queue2 adds a 5MB buffer between the network stream and audio output,
# so WiFi latency spikes don't starve playback on the Pi Zero 2 W
output = queue2 max-size-bytes=5242880 max-size-time=0 max-size-buffers=0 ! alsasink device=btvolume

[http]
# Bind to all interfaces so the Iris web UI is accessible from LAN
hostname = 0.0.0.0
port = 6680

[bandcamp]
# Browse and play Bandcamp tracks via Mopidy-Bandcamp
# Free streams play at 128kbps
# For access to your purchased collection at higher quality (mp3-v0),
# grab your identity cookie from your browser:
#   1. Log in to bandcamp.com
#   2. Open DevTools > Application > Cookies > bandcamp.com
#   3. Copy the value of the "identity" cookie
#   4. Paste it below (uncomment the line)
identity = 7%09ziohL99lb6TjcgxIAd1EZ%2Bw9a8U7njx0HRscS0WZgkA%3D%09%7B%22id%22%3A1791119058%2C%22ex%22%3A0%7D
discover_tags = christian metal, christian black metal, christian rock, christian punk, christian hardcore, christian worship, unblack metal, white metal, christian ambient, christian alternative, christian indie, christian progressive rock
discover_genres = classical, prog rock, post rock
discover_pages = 1
collection_items = 50
image_sizes = 2

[alsamixer]
card = 0
control = BTVolume

[file]
# Optionally serve local music files
# media_dirs = /home/pi/music
enabled = false

[m3u]
# Local M3U playlist storage. Hardcoded paths because the daemon runs with
# an empty XDG env, so the default `$xdg_music_dir` fails to expand and the
# extension silently disables itself — which makes "save playlist" in Iris
# a no-op.
enabled = true
base_dir = /var/lib/mopidy/m3u
playlists_dir = /var/lib/mopidy/m3u
default_encoding = utf-8
default_extension = .m3u8

[mpd]
# MPD protocol server — any MPD client can control Mopidy
hostname = 0.0.0.0
port = 6600

[spotify]
# Browse and play Spotify tracks via Mopidy-Spotify v5 (requires Premium)
# Credentials live in /etc/mopidy/conf.d/spotify-secrets.conf (not tracked in git)
# Get client_id/client_secret at: https://mopidy.com/ext/spotify/#authentication
enabled = true

[iris]
country = US
locale = en_US_us
